<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Zielinski & Rozen — Sign Up</title>
<style>
  :root{
    --cream:#F4F0E8;
    --off:#1B1B1B;
    --off-soft:#6B7280;
    --line:rgba(27,27,27,.22);
    --ok:#0B6B3A;
    --err:#9B1C1C;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--cream)}
  body{
    font-family:var(--sans);
    color:var(--off);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:28px 14px;
  }

  .sheet{
    width:min(640px,100%);
    background:var(--cream);
    border:1px solid var(--line);
    padding:30px 24px 22px;
    display:flex;
    flex-direction:column;
    gap:22px;
    transform-origin:center top;
    animation:zr-enter .8s cubic-bezier(.16,.84,.44,1) both;
  }
  @keyframes zr-enter{
    from{opacity:0;transform:scale(.972)}
    to{opacity:1;transform:scale(1)}
  }
  @media (prefers-reduced-motion: reduce){
    .sheet{animation:none}
  }

  .logo{display:block;width:188px;height:auto;margin:2px auto 4px;opacity:.92}

  .head{display:flex;flex-direction:column;gap:9px;text-align:center}
  .head h1{
    font-family:var(--serif);
    font-size:27px;
    font-weight:400;
    line-height:1.15;
    letter-spacing:.01em;
  }
  .head .sub{font-size:14.5px;line-height:1.5;color:var(--off-soft);max-width:46ch;margin:0 auto}

  form{display:flex;flex-direction:column;gap:20px}
  .field{display:flex;flex-direction:column;gap:7px}
  .field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--off-soft)}
  .field input,.field select{
    width:100%;
    height:46px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--off);
    padding:0 12px;
    font-size:16px;
    font-family:var(--sans);
    border-radius:0;
    appearance:none;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--off)}
  #email{direction:ltr;text-align:left}

  /* select caret — right in LTR, left in RTL */
  .field select{
    background-image:linear-gradient(45deg,transparent 50%,var(--off) 50%),linear-gradient(135deg,var(--off) 50%,transparent 50%);
    background-position:calc(100% - 18px) 20px,calc(100% - 12px) 20px;
    background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:34px;
  }
  [dir="rtl"] .field select{
    background-position:18px 20px,24px 20px;
    padding-right:12px;padding-left:34px;
  }

  .consent{display:flex;gap:9px;align-items:flex-start;margin-top:2px}
  .consent input{
    margin-top:2px;width:16px;height:16px;min-width:16px;
    border:1px solid var(--line);appearance:none;background:#fff;cursor:pointer;
  }
  .consent input:checked{background:var(--off)}
  .consent .txt{font-size:12px;line-height:1.5;color:var(--off)}
  .consent a{color:inherit;text-decoration:underline;text-underline-offset:2px}

  button[type="submit"]{
    border-radius:0;margin-top:4px;height:50px;
    border:1px solid var(--off);background:var(--off);color:#fff;
    font-family:var(--sans);font-size:13px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;
  }
  button[disabled]{opacity:.6;cursor:wait}

  .status{min-height:18px;font-size:12.5px;color:var(--off-soft);text-align:center}
  .status.ok{color:var(--ok)}
  .status.err{color:var(--err)}

  .lang-switch{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:6px;padding-top:16px;border-top:1px solid var(--line);
  }
  .lang-switch label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--off-soft)}
  .lang-switch select{
    appearance:none;border:0;background:transparent;
    font-family:var(--sans);font-size:13px;color:var(--off);cursor:pointer;
    padding:4px 18px 4px 6px;
    background-image:linear-gradient(45deg,transparent 50%,var(--off-soft) 50%),linear-gradient(135deg,var(--off-soft) 50%,transparent 50%);
    background-position:calc(100% - 8px) 11px,calc(100% - 4px) 11px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  }

  details.debug{border-top:1px solid var(--line);padding-top:10px}
  details.debug summary{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--off-soft);cursor:pointer;list-style:none}
  details.debug summary::-webkit-details-marker{display:none}
  details.debug pre{
    margin-top:8px;font-size:11px;line-height:1.45;white-space:pre-wrap;word-break:break-word;
    color:var(--off-soft);text-align:left;direction:ltr;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }

  @media (min-width: 768px){
    body{padding:40px}
    .sheet{padding:34px 36px 24px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .head h1{font-size:30px}
  }
</style>
</head>
<body>
<main class="sheet" aria-label="signup form">
  <img class="logo" src="logo.svg" alt="Zielinski & Rozen" width="188" height="39">
  <header class="head">
    <h1 id="t-title"></h1>
    <p class="sub" id="t-subtitle"></p>
  </header>

  <form id="qr-form" novalidate>
    <div class="row">
      <div class="field">
        <label for="full-name" id="t-name"></label>
        <input id="full-name" name="full_name" type="text" autocomplete="name">
      </div>
      <div class="field">
        <label for="email" id="t-email"></label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="name@example.com">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="country" id="t-country"></label>
        <select id="country" name="country" required></select>
      </div>
      <div class="field">
        <label for="city" id="t-city"></label>
        <input id="city" name="city" type="text" required>
      </div>
    </div>

    <input id="store-id" name="store_id" type="hidden">
    <input id="channel" name="channel" type="hidden">
    <input id="qr-id" name="qr_id" type="hidden">

    <label class="consent" for="privacy-consent">
      <input id="privacy-consent" name="privacy_consent" type="checkbox" required>
      <span class="txt"><span id="c-pre"></span><a id="c-link" href="https://zielinskiandrozen.com/pages/gdpr-privacy-policy" target="_blank" rel="noopener"></a><span id="c-post"></span></span>
    </label>

    <button id="submit-btn" type="submit"></button>
    <p class="status" id="status" aria-live="polite"></p>

    <details class="debug" id="debug-block">
      <summary>Debug Context</summary>
      <pre id="debug-json"></pre>
    </details>
  </form>

  <div class="lang-switch">
    <label for="lang-select" id="t-lang-label"></label>
    <select id="lang-select"></select>
  </div>
</main>

    ru:{title:"Узнайте первыми",subtitle:"Подпишитесь, чтобы получать эксклюзивные предложения и ранний доступ к новым ароматам и искусству.",name:"Полное имя",email:"Электронная почта",country:"Страна",city:"Город",name_ph:"Ваше имя",city_ph:"Город",select_country:"Выберите страну",c_pre:"Я прочитал(а) и согласен(на) с ",privacy:"Политикой конфиденциальности",c_post:" (обязательно)",button:"Подписаться",sending:"Отправка…",success:"Спасибо — вы подписаны.",err_http:"Что-то пошло не так. Попробуйте ещё раз.",err_net:"Ошибка сети. Попробуйте ещё раз.",err_required:"Пожалуйста, заполните все обязательные поля.",lang_label:"Язык"},
    hi:{title:"सबसे पहले जानें",subtitle:"विशेष ऑफ़र और नई खुशबुओं व कला तक जल्दी पहुंच के लिए साइन अप करें।",name:"पूरा नाम",email:"ईमेल",country:"देश",city:"शहर",name_ph:"आपका नाम",city_ph:"शहर",select_country:"देश चुनें",c_pre:"मैंने ",privacy:"गोपनीयता नीति",c_post:" पढ़ ली है और सहमत हूं (आवश्यक)",button:"साइन अप करें",sending:"भेजा जा रहा है…",success:"धन्यवाद — आप सूची में शामिल हैं।",err_http:"कुछ गलत हो गया। कृपया पुनः प्रयास करें।",err_net:"नेटवर्क त्रुटि। कृपया पुनः प्रयास करें।",err_required:"कृपया सभी आवश्यक फ़ील्ड भरें।",lang_label:"भाषा"},
    zh:{title:"抢先知道",subtitle:"注册以获取专属优惠，并抢先了解全新香氛与艺术。",name:"全名",email:"电子邮箱",country:"国家/地区",city:"城市",name_ph:"您的姓名",city_ph:"城市",select_country:"选择国家/地区",c_pre:"我已阅读并同意",privacy:"隐私政策",c_post:"（必填）",button:"注册",sending:"发送中…",success:"谢谢 — 您已成功注册。",err_http:"出错了，请重试。",err_net:"网络错误，请重试。",err_required:"请填写所有必填字段。",lang_label:"语言"}
  };

  // ---------- countries (ISO-2 codes; English names for the submitted value + fallback) ----------
  var COUNTRY_EN = {
    IL:'Israel', AE:'United Arab Emirates', SA:'Saudi Arabia', QA:'Qatar', KW:'Kuwait', BH:'Bahrain', OM:'Oman',
    JO:'Jordan', LB:'Lebanon', EG:'Egypt', TR:'Turkey', MA:'Morocco', TN:'Tunisia', DZ:'Algeria',
    AT:'Austria', BE:'Belgium', BG:'Bulgaria', CH:'Switzerland', CY:'Cyprus', CZ:'Czechia', DE:'Germany',
    DK:'Denmark', EE:'Estonia', ES:'Spain', FI:'Finland', FR:'France', GB:'United Kingdom', GR:'Greece',
    HR:'Croatia', HU:'Hungary', IE:'Ireland', IS:'Iceland', IT:'Italy', LT:'Lithuania', LU:'Luxembourg',
    LV:'Latvia', MT:'Malta', NL:'Netherlands', NO:'Norway', PL:'Poland', PT:'Portugal', RO:'Romania',
    RS:'Serbia', RU:'Russia', SE:'Sweden', SI:'Slovenia', SK:'Slovakia', UA:'Ukraine',
    US:'United States', CA:'Canada', MX:'Mexico', BR:'Brazil', AR:'Argentina', CL:'Chile', CO:'Colombia', PE:'Peru',

    AU:'Australia', NZ:'New Zealand', TH:'Thailand'
  };
  var COUNTRY_CODES = Object.keys(COUNTRY_EN);

  // country -> default UI language
  var COUNTRY_LANG = {
    IL:'he',
    AE:'ar', SA:'ar', QA:'ar', KW:'ar', BH:'ar', OM:'ar', JO:'ar', LB:'ar', EG:'ar', MA:'ar', TN:'ar', DZ:'ar',
    FR:'fr',
    ES:'es', MX:'es', AR:'es', CL:'es', CO:'es', PE:'es',
    BR:'pt', PT:'pt',
    RU:'ru',
    IN:'hi',
    CN:'zh', HK:'zh', TW:'zh',
    DE:'de', AT:'de',
    IT:'it'
  };

  function qp(name, sp){ return (sp.get(name) || '').trim(); }

  function parseParams(){
    var sp = new URLSearchParams(window.location.search);
    return {
      store_id: qp('store_id',sp)||qp('store',sp)||qp('shop_id',sp)||qp('location_id',sp),
      city: qp('city',sp),
      country: qp('country',sp)||qp('country_code',sp),
      channel: qp('channel',sp)||qp('source',sp)||qp('utm_source',sp)||'qr-code',
      qr_id: qp('qr_id',sp)||qp('qr',sp)||qp('code',sp),
      lang: qp('lang',sp)||qp('locale',sp),
      utm_source: qp('utm_source',sp), utm_medium: qp('utm_medium',sp),
      utm_campaign: qp('utm_campaign',sp), utm_term: qp('utm_term',sp), utm_content: qp('utm_content',sp)
    };
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function normalizeCountry(raw){
    if(!raw) return '';
    var clean = raw.replace(/_/g,' ').trim();
    if(clean.length===2){ var code=clean.toUpperCase(); if(COUNTRY_EN[code]) return code; }
    var lower = clean.toLowerCase();
    for(var i=0;i<COUNTRY_CODES.length;i++){ if(COUNTRY_EN[COUNTRY_CODES[i]].toLowerCase()===lower) return COUNTRY_CODES[i]; }
    return clean;
  }

  function localizedCountryName(code, lang){
    try{
      if(window.Intl && Intl.DisplayNames){
        var dn = new Intl.DisplayNames([DN_LOCALE[lang]||lang,'en'], {type:'region'});
        var n = dn.of(code);
        if(n && n !== code) return n;
      }
    }catch(e){}
    return COUNTRY_EN[code] || code;
  }

  function buildCountrySelect(select, lang, keepVal){
    var sel = keepVal != null ? keepVal : select.value;
    var rows = COUNTRY_CODES.map(function(code){ return [code, localizedCountryName(code, lang)]; });
    try{ rows.sort(function(a,b){ return a[1].localeCompare(b[1], DN_LOCALE[lang]||lang); }); }
    catch(e){ rows.sort(function(a,b){ return a[1]<b[1]?-1:1; }); }
    var html = '<option value="">'+escapeHtml(STR[lang].select_country)+'</option>';
    rows.forEach(function(r){ html += '<option value="'+r[0]+'">'+escapeHtml(r[1])+'</option>'; });
    // preserve a custom (non-list) value that came from a URL param
    if(sel && !COUNTRY_EN[sel]){ html += '<option value="'+escapeHtml(sel)+'">'+escapeHtml(sel)+'</option>'; }
    select.innerHTML = html;
    if(sel) select.value = sel;
  }

  // ---------- language detection ----------
  function navLangMatch(){
    var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language||''];
    for(var i=0;i<langs.length;i++){
      var p = String(langs[i]||'').toLowerCase().split('-')[0];
      if(p==='iw') p='he';
      if(p==='in') p='id'; // edge: legacy code, not supported -> skip
      if(SUPPORTED.indexOf(p)!==-1) return p;
    }
    return '';
  }

  function determineLang(params, normCountry){
    if(params.lang){ var l=params.lang.toLowerCase().split('-')[0]; if(SUPPORTED.indexOf(l)!==-1) return {lang:l, source:'url'}; }
    var saved=''; try{ saved=localStorage.getItem('zr_lang')||''; }catch(e){}
    if(saved && SUPPORTED.indexOf(saved)!==-1) return {lang:saved, source:'saved'};
    var nav = navLangMatch();
    if(nav) return {lang:nav, source:'browser'};
    if(normCountry && COUNTRY_LANG[normCountry]) return {lang:COUNTRY_LANG[normCountry], source:'country'};
    return {lang:'en', source:'default'};
  }

  // ---------- render ----------
  var els = {};
  function $(id){ return document.getElementById(id); }

  function render(){
    var s = STR[currentLang];
    document.documentElement.lang = currentLang;
    document.documentElement.dir = RTL[currentLang] ? 'rtl' : 'ltr';

    $('t-title').textContent = s.title;
    $('t-subtitle').textContent = s.subtitle;
    $('t-name').textContent = s.name;
    $('t-email').textContent = s.email;
    $('t-country').textContent = s.country;
    $('t-city').textContent = s.city;
    $('full-name').placeholder = s.name_ph;
    $('city').placeholder = s.city_ph;
    $('c-pre').textContent = s.c_pre;
    $('c-link').textContent = s.privacy;
    $('c-post').textContent = s.c_post;
    $('submit-btn').textContent = s.button;
    $('t-lang-label').textContent = s.lang_label;

    buildCountrySelect($('country'), currentLang);
    if($('lang-select').value !== currentLang) $('lang-select').value = currentLang;
    postHeight();
  }

  function setLang(lang, source){
    if(SUPPORTED.indexOf(lang)===-1) return;
    currentLang = lang; langSource = source || 'manual';
    render();
  }

  // ---------- payload ----------
  function detectBrowser(ua){
    if(/Edg\//.test(ua)) return 'Edge';
    if(/OPR\//.test(ua)) return 'Opera';
    if(/Chrome\//.test(ua)&&!/Edg\//.test(ua)&&!/OPR\//.test(ua)) return 'Chrome';
    if(/Safari\//.test(ua)&&!/Chrome\//.test(ua)) return 'Safari';
    if(/Firefox\//.test(ua)) return 'Firefox';
    return 'Unknown';
  }
  function deviceType(ua){ return /Mobi|Android|iPhone|iPad|iPod/i.test(ua)?'mobile':'desktop'; }
  function splitName(full){
    var clean=(full||'').trim(); if(!clean) return {};
    var bits=clean.split(/\s+/); if(bits.length===1) return {first_name:bits[0]};
    return {first_name:bits.shift(), last_name:bits.join(' ')};
  }
  function countryValueForLocation(v){ if(!v) return ''; return COUNTRY_EN[v]||v; }

  function setStatus(text, kind){
    var el=$('status'); el.textContent=text||''; el.classList.remove('ok','err'); if(kind) el.classList.add(kind);
  }

  function contextData(params, countryLabel, cityValue){
    var ua=navigator.userAgent||'';
    return {
      store_id: params.store_id||null, channel: params.channel||'qr-code', qr_id: params.qr_id||null,
      ui_language: currentLang, language_source: langSource,
      browser_name: detectBrowser(ua), browser_language: navigator.language||null,
      browser_languages: (navigator.languages||[]).join(', ')||null,
      timezone: (Intl.DateTimeFormat().resolvedOptions().timeZone||null),
      platform: navigator.platform||null, device_type: deviceType(ua), user_agent: ua,
      screen_resolution: (window.screen.width+'x'+window.screen.height),
      viewport: (window.innerWidth+'x'+window.innerHeight),
      referrer: document.referrer||null, landing_url: location.href, landing_path: location.pathname,
      query_string: location.search||null,
      utm_source: params.utm_source||null, utm_medium: params.utm_medium||null, utm_campaign: params.utm_campaign||null,
      utm_term: params.utm_term||null, utm_content: params.utm_content||null,
      city_input: cityValue||null, country_input: countryLabel||null,
      geo_country: geoInfo?geoInfo.country_code:null, geo_city: geoInfo?geoInfo.city:null, geo_source: geoInfo?geoInfo.source:null,
      location_source: (params.city||params.country)?'url-param':(geoInfo?'ip-geo':'manual'),
      source: 'in-store-qr-api-form',
      consent_privacy_policy: true, consent_privacy_policy_at: new Date().toISOString()
    };
  }
  function cleanObject(obj){ var out={}; Object.keys(obj).forEach(function(k){var v=obj[k]; if(v!==null&&v!==undefined&&v!=='') out[k]=v;}); return out; }

  function buildPayload(values, params){
    var nameParts=splitName(values.full_name);
    var countryLabel=countryValueForLocation(values.country);
    var props=cleanObject(contextData(params, countryLabel, values.city));
    var attrs=cleanObject({email:values.email, first_name:nameParts.first_name, last_name:nameParts.last_name});
    attrs.location=cleanObject({city:values.city, country:countryLabel});
    attrs.properties=props;
    return {data:{type:'subscription',attributes:{profile:{data:{type:'profile',attributes:attrs}}},relationships:{list:{data:{type:'list',id:LIST_ID}}}}};
  }

  function renderDebug(payload, submitState){
    var details=$('debug-block');
    var dbg=new URLSearchParams(location.search).get('debug');
    if(dbg!=='1'){ details.style.display='none'; details.open=false; }
    else { details.style.display='block'; details.open=true; }
    var view={endpoint:API_URL, list_id:LIST_ID, ui_language:currentLang, language_source:langSource, submit:submitState||'idle',
      profile_preview: payload?payload.data.attributes.profile.data.attributes:null};
    $('debug-json').textContent=JSON.stringify(view,null,2);
  }

  async function submitToKlaviyo(payload){
    var res=await fetch(API_URL,{method:'POST',headers:{'accept':'application/vnd.api+json','content-type':'application/vnd.api+json','revision':REVISION},body:JSON.stringify(payload)});
    if(res.ok) return {ok:true,status:res.status};
    var bodyText=''; try{bodyText=await res.text();}catch(e){}
    return {ok:false,status:res.status,body:bodyText};
  }

  // ---------- IP geo fallback (only when city/country absent) ----------
  function applyGeo(geo){
    if(!params.country && geo.country_code && !$('country').value){
      var norm=normalizeCountry(geo.country_code);
      if(norm){ if(!COUNTRY_EN[norm]) buildCountrySelect($('country'), currentLang, norm); $('country').value=norm; }
    }
    if(!params.city && geo.city && !$('city').value){ $('city').value=geo.city; }
    geoInfo={source:geo._source, country_code:geo.country_code||null, city:geo.city||null};
    // If language was only a default, upgrade it from the detected country.
    if(langSource==='default' && geo.country_code && COUNTRY_LANG[geo.country_code.toUpperCase()]){
      setLang(COUNTRY_LANG[geo.country_code.toUpperCase()], 'geo-country');
    }
    renderDebug(null,'idle'); postHeight();
  }
  function fetchGeo(){
    fetch('https://ipapi.co/json/').then(function(r){return r.ok?r.json():Promise.reject();})
      .then(function(d){ if(d&&(d.country_code||d.city)){d._source='ipapi.co';applyGeo(d);} else throw new Error('empty'); })
      .catch(function(){
        fetch('https://ipwho.is/').then(function(r){return r.json();})
          .then(function(d){ if(d&&d.success!==false&&(d.country_code||d.city)){d._source='ipwho.is';applyGeo(d);} })
          .catch(function(){});
      });
  }

  // ---------- iframe height broadcast ----------
  function postHeight(){
    try{ var h=document.documentElement.scrollHeight;
      if(window.parent && window.parent!==window) window.parent.postMessage({type:'zr-klaviyo-form:height',height:h},'*');
    }catch(e){}
  }

  // ---------- init ----------
  var params = parseParams();
  var normalizedCountry = normalizeCountry(params.country);

  var det = determineLang(params, normalizedCountry);
  currentLang = det.lang; langSource = det.source;

  // language switcher options
  (function(){
    var ls=$('lang-select'), html='';
    SUPPORTED.forEach(function(code){ html += '<option value="'+code+'">'+escapeHtml(LANG_NAMES[code])+'</option>'; });
    ls.innerHTML=html; ls.value=currentLang;
    ls.addEventListener('change', function(){
      try{ localStorage.setItem('zr_lang', ls.value); }catch(e){}
      setLang(ls.value, 'manual');
    });
  })();

  render();

  // prefill from URL params
  $('city').value = params.city || '';
  $('store-id').value = params.store_id || '';
  $('channel').value = params.channel || 'qr-code';
  $('qr-id').value = params.qr_id || '';
  if(normalizedCountry){ if(!COUNTRY_EN[normalizedCountry]) buildCountrySelect($('country'), currentLang, normalizedCountry); $('country').value = normalizedCountry; }
  renderDebug(null,'idle');

  if(!params.country || !params.city) fetchGeo();

  $('qr-form').addEventListener('submit', async function(e){
    e.preventDefault();
    setStatus('', null);
    var s = STR[currentLang];
    if(!this.checkValidity()){ setStatus(s.err_required,'err'); this.reportValidity(); return; }
    var values={ full_name:$('full-name').value.trim(), email:$('email').value.trim(), country:$('country').value, city:$('city').value.trim() };
    var payload=buildPayload(values, params);
    renderDebug(payload,'sending'); $('submit-btn').disabled=true; setStatus(s.sending,null);
    try{
      var result=await submitToKlaviyo(payload);
      if(result.ok){ setStatus(s.success,'ok'); renderDebug(payload,'success: HTTP '+result.status); this.reset(); render(); }
      else { setStatus(s.err_http,'err'); renderDebug(payload,'failed: HTTP '+result.status); }
    }catch(err){ setStatus(s.err_net,'err'); renderDebug(payload,'failed: network error'); }
    finally{ $('submit-btn').disabled=false; postHeight(); }
  });

  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  if(window.ResizeObserver) new ResizeObserver(postHeight).observe(document.documentElement);
  postHeight();
})();
</script>
</body>
</html>
